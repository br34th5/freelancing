name: HN Daily Scrape

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/scraping/scheduled-hn/requirements.txt

      - name: Run scraper
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python scheduled_scraper.py
        working-directory: projects/scraping/scheduled-hn

      - name: Upload data
        uses: actions/upload-artifact@v3
        with:
          name: hn-data-${{ github.run_number }}
          path: projects/scraping/scheduled-hn/data/
          retention-days: 30

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: scraper-log-${{ github.run_number }}
          path: projects/scraping/scheduled-hn/hn_scraper.log
          retention-days: 30
