name: HN Daily Scrape

on:
  schedule:
    - cron: '10 9 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r projects/scraping/scheduled-hn/requirements.txt

      - name: Create data directory
        run: mkdir -p projects/scraping/scheduled-hn/data

      - name: Run scraper
        env:
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          PROXY_LIST: ${{ secrets.PROXY_LIST }}
        run: python scheduled_scraper.py
        working-directory: projects/scraping/scheduled-hn

      - name: Commit data to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f projects/scraping/scheduled-hn/data/
          git diff --staged --quiet || git commit -m "chore: update HN data $(date +%Y-%m-%d)"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-log-${{ github.run_number }}
          path: projects/scraping/scheduled-hn/hn_scraper.log
          retention-days: 7
