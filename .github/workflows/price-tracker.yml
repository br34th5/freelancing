name: skelbiu Price Tracker

on:
  schedule:
    # 06:10 UTC ≈ 09:10 Europe/Vilnius (EEST, summer). Winter shifts to 08:10 local.
    - cron: '10 6 * * *'
  workflow_dispatch:

jobs:
  track:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: projects/scraping/price-tracker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        working-directory: projects/scraping/price-tracker

      # Patchright browsers are required for StealthyFetcher (real Chrome + CF solve).
      # ubuntu-22.04 runners have Chromium pre-installed at /usr/bin/chromium,
      # but patchright bundles its own. `patchright install` downloads the bundled
      # Chromium (~150MB). Falls back to Fetcher (TLS impersonation) if this fails.
      - name: Install patchright browsers
        run: patchright install chromium || echo "patchright install skipped"
        working-directory: projects/scraping/price-tracker

      # Pipeline: crawl → score → report. Break conditions (0 items, DB
      # failure, scoring/report crash) alert to Discord via run_daily and
      # exit non-zero so this job shows red in Actions.
      #
      # Engine: stealthy (real Chrome + auto CF solve) + Oxylabs residential
      # proxy. Falls back to fetcher (TLS impersonation) if browser unavailable.
      # Without a working proxy, datacenter IPs may still get 403 — accept
      # occasional 0-item alerts or upgrade to premium anti-bot bypass.
      - name: Run daily pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          FETCH_ENGINE: stealthy
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USER: ${{ secrets.PROXY_USER }}
          PROXY_PASS: ${{ secrets.PROXY_PASS }}
          FALLBACK_PROXY_LIST: ${{ secrets.FALLBACK_PROXY_LIST }}
          FALLBACK_PROXY_USER: ${{ secrets.FALLBACK_PROXY_USER }}
          FALLBACK_PROXY_PASS: ${{ secrets.FALLBACK_PROXY_PASS }}
        run: python -m run_daily
        working-directory: projects/scraping/price-tracker

      - name: Upload report + logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-tracker-${{ github.run_number }}
          path: |
            projects/scraping/price-tracker/data/report.txt
            projects/scraping/price-tracker/data/report.html
            projects/scraping/price-tracker/data/spider.log
            projects/scraping/price-tracker/data/cron.log
          retention-days: 14
          if-no-files-found: warn
